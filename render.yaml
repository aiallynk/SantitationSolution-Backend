services:
  - type: web
    name: sanitation-backend-api
    env: node
    rootDir: .
    plan: starter
    buildCommand: npm install
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DB_SSL
        value: "true"
      - key: AUTO_RUN_MIGRATIONS
        value: "false"
      - key: AUTO_RUN_MIGRATIONS_STRICT
        value: "false"
      - key: ANALYSIS_WORKER_EMBEDDED
        value: "true"
      - key: REDIS_ENABLED
        value: "false"
      - key: CORS_ORIGIN
        value: https://*.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false

